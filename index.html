<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spin the Bottle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header><div class="brand">🍾 <b>Spin the Bottle</b></div><button id="theme">☾</button></header>
  <main>
    <section class="card profile"><div id="avatar">👤</div><div><b id="name">Mehmon</b><small id="username">@guest</small></div><span class="online">●</span></section>
    <section class="card">
      <div class="roomtop"><div><small>XONA</small><h2 id="room">ROOM-001</h2></div><button class="copy" id="copy">Nusxa</button></div>
      <div class="players" id="players"></div>
      <button class="primary" id="spin">🍾 BUTILKANI AYLANtirish</button>
      <p class="hint" id="result">Kamida 2 o‘yinchi kerak.</p>
    </section>
    <section class="card gifts">
      <h3>🎁 Sovg‘alar</h3><div class="giftrow">
        <button data-gift="❤️">❤️<span>Yurak</span></button>
        <button data-gift="⭐">⭐<span>Yulduz</span></button>
        <button data-gift="🎁">🎁<span>Sovg‘a</span></button>
        <button data-gift="🔥">🔥<span>Olov</span></button>
      </div>
      <div id="feed"></div>
    </section>
  </main>
  <nav><button class="active">🎮<small>O‘yin</small></button><button>👥<small>O‘yinchilar</small></button><button>🏆<small>Reyting</small></button></nav>
</div>
<script src="script.js"></script>
</body></html>
